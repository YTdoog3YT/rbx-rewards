<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBX Rewards - Oglądaj i zbieraj Robuxy</title>
    <!-- Monetag Vignette Script -->
    <script>(function(s){s.dataset.zone='11460706',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }
        .stats {
            font-size: 18px;
            margin-bottom: 15px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RBX Rewards 🎮</h1>
        <div class="stats">
            Twoje punkty: <span id="points">0</span> | Status: <span id="status">Oglądaj film, aby zbierać punkty!</span>
        </div>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <p>Zostań na stronie i oglądaj materiał, żeby nabić saldo!</p>
    </div>

    <script>
        let points = 0;
        const pointsDisplay = document.getElementById('points');
        const statusDisplay = document.getElementById('status');

        // Stoper naliczający punkty co 10 sekund
        setInterval(() => {
            points += 10;
            pointsDisplay.textContent = points;
            statusDisplay.textContent = "Punkty rosną! Trzymaj się z nami.";
        }, 10000);
    </script>
</body>
</html>
