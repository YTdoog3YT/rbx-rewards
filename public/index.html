<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBX Rewards</title>
    <script src='//libtl.com/sdk.js' data-zone='11461260' data-sdk='show_11461260'></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        .hidden { display: none; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #2a2a2a; color: white; width: 60%; }
        button { background: #00b06f; color: white; cursor: pointer; font-weight: bold; }
        .stats { background: #2a2a2a; padding: 15px; border-radius: 5px; margin-bottom: 15px; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #333; font-size: 14px; }
        th { background: #2a2a2a; color: #00b06f; }
    </style>
</head>
<body>

<div class="container">
    <h1>RBX Rewards 🎮</h1>

    <div id="login-section">
        <p>Wpisz swój nick z Roblox:</p>
        <input type="text" id="username-input" placeholder="Twój nick z Roblox...">
        <button onclick="login()">Zaloguj się</button>
    </div>

    <div id="main-section" class="hidden">
        <div class="stats">
            Gracz: <span id="display-user" style="color: #00b06f;"></span> | 
            Punkty: <span id="points">0</span> RBX
        </div>

        <button onclick="triggerAd()" style="background: #ff5555; font-size: 18px; padding: 12px 25px;">
            Obejrzyj reklamę (+50 RBX)
        </button>

        <h3>Ostatnia historia zdobywania punktów</h3>
        <table>
            <thead>
                <tr>
                    <th>Akcja</th>
                    <th>Punkty</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody id="history-list">
                <tr><td colspan="3">Brak historii...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentUser = "";

    async function login() {
        const username = document.getElementById('username-input').value.trim();
        if (!username) return alert('Wpisz nick!');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();

            currentUser = data.username;
            document.getElementById('display-user').textContent = currentUser;
            document.getElementById('points').textContent = data.points;

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');

            loadHistory();
        } catch (e) {
            alert('Błąd podczas logowania do serwera');
        }
    }

    async function triggerAd() {
        if (typeof show_11461260 === 'function') {
            show_11461260().then(async () => {
                // Po udanym obejrzeniu reklamy wysyłamy info do bazy
                const res = await fetch('/api/add-points', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser,
                        pointsToAdd: 50,
                        actionName: 'Obejrzano reklamę Monetag'
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('points').textContent = data.points;
                    loadHistory();
                }
            }).catch(() => {
                alert('Reklama została zamknięta za szybko.');
            });
        } else {
            alert('Wczytywanie reklamy... Spróbuj ponownie za chwilę.');
        }
    }

    async function loadHistory() {
        const res = await fetch(`/api/history/${currentUser}`);
        const history = await res.json();
        const tbody = document.getElementById('history-list');

        if (history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">Brak historii...</td></tr>';
            return;
        }

        tbody.innerHTML = history.map(row => `
            <tr>
                <td>${row.action}</td>
                <td style="color:#00b06f; font-weight:bold;">+${row.points_earned}</td>
                <td>${new Date(row.timestamp).toLocaleString()}</td>
            </tr>
        `).join('');
    }
</script>
</body>
</html>
