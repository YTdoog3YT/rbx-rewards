<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBX Rewards - Darmowe Robuxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        .hidden { display: none; }
        input, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin: 5px;
        }
        input { width: 60%; background: #2a2a2a; color: white; }
        button { background: #00b06f; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #00965e; }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin: 20px 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }
        .stats {
            font-size: 18px;
            margin-bottom: 15px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RBX Rewards 🎮</h1>

        <!-- Ekran logowania na nick -->
        <div id="login-section">
            <p>Wpisz swój nick z Roblox, aby zacząć zbierać punkty:</p>
            <input type="text" id="username-input" placeholder="Twój nick z Roblox...">
            <br>
            <button onclick="login()">Zaloguj się</button>
        </div>

        <!-- Panel główny (po zalogowaniu) -->
        <div id="main-section" class="hidden">
            <div class="stats">
                Gracz: <span id="display-user" style="color: #00b06f; font-weight: bold;"></span> | 
                Punkty: <span id="points">0</span> RBX
            </div>
            
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <h3>Zarabiaj punkty:</h3>
            <p>Kliknij poniższy przycisk, przejdź do strony sponsorowanej i odbierz punkty!</p>
            
            <!-- Link prowadzący bezpośrednio do Twojego Direct Linka -->
            <a href="https://omg10.com/4/11460742" target="_blank" onclick="claimReward()">
                <button style="background: #ff5555; font-size: 18px; padding: 12px 25px;">Obejrzyj reklamę i odbierz +50 punktów</button>
            </a>
        </div>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username-input').value.trim();
            if (username) {
                document.getElementById('display-user').textContent = username;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
            } else {
                alert('Wpisz poprawny nick z Roblox!');
            }
        }

        let points = 0;
        function claimReward() {
            // Po kliknięciu w przycisk i przejście do reklamy naliczamy punkty
            setTimeout(() => {
                points += 50;
                document.getElementById('points').textContent = points;
            }, 1500);
        }
    </script>
</body>
</html>
