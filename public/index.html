<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBX Rewards 🎮</title>

    <script src='//libtl.com/sdk.js' data-zone='11461260' data-sdk='show_11461260'></script>

    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        .hidden { display: none; }
        input, button { padding: 12px; margin: 8px; font-size: 16px; border-radius: 6px; border: none; }
        input { background: #2a2a2a; color: white; width: 70%; text-align: center; outline: none; border: 1px solid #333; }
        button { background: #00b06f; color: white; cursor: pointer; font-weight: bold; width: 80%; }
        button:hover { background: #008f5a; }
        
        .stats { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #00b06f; margin-bottom: 10px; box-shadow: 0 0 10px rgba(0, 176, 111, 0.5); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #333; font-size: 14px; }
        th { background: #2a2a2a; color: #00b06f; }
        .ad-box { background: #252525; border: 1px dashed #00b06f; padding: 15px; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>RBX Rewards 🎮</h1>

    <div id="login-section">
        <p>Wpisz swój dokładny nick z Roblox:</p>
        <input type="text" id="username-input" placeholder="Twój nick z Roblox..."><br>
        <button onclick="login()">Zaloguj się</button>
    </div>

    <div id="main-section" class="hidden">
        <div class="stats">
            <!-- Tutaj wskoczy zdjęcie z Robloxa -->
            <img id="player-avatar" class="avatar" src="" alt="Avatar gracza"><br>
            Gracz: <span id="display-user" style="color: #00b06f;"></span><br>
            Punkty: <span id="points" style="font-weight: bold; font-size: 22px;">0</span> RBX
        </div>

        <div class="ad-box">
            <h3>Strefa Zarabiania</h3>
            <button onclick="triggerAd()" style="background: #ff5555; font-size: 18px;">
                🎬 Obejrzyj Pełną Reklamę (+50 RBX)
            </button>
        </div>

        <h3>Historia Twoich Punktów</h3>
        <table>
            <thead>
                <tr>
                    <th>Akcja</th>
                    <th>Punkty</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody id="history-list">
                <tr><td colspan="3">Brak historii...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentRobloxId = null; // Trzymamy ID, a nie nick

    async function login() {
        const username = document.getElementById('username-input').value.trim();
        if (!username) return alert('Wpisz poprawny nick!');

        const btn = document.querySelector('#login-section button');
        btn.textContent = "Weryfikacja konta...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();

            if (data.error) {
                alert(data.error); // Wyrzuca błąd "Takie konto nie istnieje!"
                btn.textContent = "Zaloguj się";
                btn.disabled = false;
                return;
            }

            // Jeśli konto istnieje, ustawiamy dane
            currentRobloxId = data.roblox_id;
            
            document.getElementById('player-avatar').src = data.avatarUrl;
            document.getElementById('display-user').textContent = data.username;
            document.getElementById('points').textContent = data.points;

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');

            loadHistory();
        } catch (e) {
            alert('Błąd połączenia z serwerem.');
            btn.textContent = "Zaloguj się";
            btn.disabled = false;
        }
    }

    async function triggerAd() {
        if (typeof show_11461260 === 'function') {
            show_11461260().then(async () => {
                const res = await fetch('/api/add-points', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        robloxId: currentRobloxId,
                        pointsToAdd: 50,
                        actionName: 'Obejrzano reklamę Monetag'
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('points').textContent = data.points;
                    loadHistory();
                }
            }).catch((err) => {
                // Nie robimy denerwującego alertu, logujemy tylko w tle
                console.log('Reklama przerwana za wcześnie.');
            });
        } else {
            alert('Kod reklamy jeszcze się ładuje. Odczekaj chwilę.');
        }
    }

    async function loadHistory() {
        const res = await fetch(`/api/history/${currentRobloxId}`);
        const history = await res.json();
        const tbody = document.getElementById('history-list');

        if (history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">Brak historii...</td></tr>';
            return;
        }

        tbody.innerHTML = history.map(row => `
            <tr>
                <td>${row.action}</td>
                <td style="color:#00b06f; font-weight:bold;">+${row.points_earned}</td>
                <td>${new Date(row.timestamp).toLocaleString()}</td>
            </tr>
        `).join('');
    }
</script>
</body>
</html>
